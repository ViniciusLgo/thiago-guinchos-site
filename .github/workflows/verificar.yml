name: Verificar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  index-em-dia:
    name: index.html em dia com src/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verificar
      - name: Arquivos referenciados existem
        run: |
          falta=0
          for f in $(grep -oE '(src|href)="assets/[^"]+"' index.html | sed -E 's/^(src|href)="//; s/"$//' | sort -u); do
            if [ ! -f "$f" ]; then echo "Falta: $f"; falta=1; fi
          done
          exit $falta
